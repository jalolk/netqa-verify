version: 1
description: >
  Intended state of the netqa topology. Live device state is compared against
  this document; any difference in either direction is reported as drift.

devices:
  r1:
    role: router
    interfaces:
      lo: [10.255.255.1/32]
      eth0: [172.100.100.11/24]
      eth1: [10.0.1.1/24]
      eth2: [10.0.12.1/24]
      eth3: [10.0.13.1/24]
    ospf:
      neighbors:
        - id: 10.255.255.2
          address: 10.0.12.2
          state: Full
        - id: 10.255.255.2
          address: 10.0.13.2
          state: Full
    routes:
      - prefix: 10.0.2.0/24
        protocol: ospf
        next_hops: [10.0.12.2, 10.0.13.2]
      - prefix: 10.255.255.2/32
        protocol: ospf
        next_hops: [10.0.12.2, 10.0.13.2]
      - prefix: 10.0.1.0/24
        protocol: connected
      - prefix: 10.0.12.0/24
        protocol: connected
      - prefix: 10.0.13.0/24
        protocol: connected
      - prefix: 10.255.255.1/32
        protocol: connected
      - prefix: 172.100.100.0/24
        protocol: connected

  r2:
    role: router
    interfaces:
      lo: [10.255.255.2/32]
      eth0: [172.100.100.12/24]
      eth1: [10.0.2.1/24]
      eth2: [10.0.12.2/24]
      eth3: [10.0.13.2/24]
    ospf:
      neighbors:
        - id: 10.255.255.1
          address: 10.0.12.1
          state: Full
        - id: 10.255.255.1
          address: 10.0.13.1
          state: Full
    routes:
      - prefix: 10.0.1.0/24
        protocol: ospf
        next_hops: [10.0.12.1, 10.0.13.1]
      - prefix: 10.255.255.1/32
        protocol: ospf
        next_hops: [10.0.12.1, 10.0.13.1]
      - prefix: 10.0.2.0/24
        protocol: connected
      - prefix: 10.0.12.0/24
        protocol: connected
      - prefix: 10.0.13.0/24
        protocol: connected
      - prefix: 10.255.255.2/32
        protocol: connected
      - prefix: 172.100.100.0/24
        protocol: connected

  h1:
    role: host
    interfaces:
      eth0: [172.100.100.21/24]
      eth1: [10.0.1.10/24]

  h2:
    role: host
    interfaces:
      eth0: [172.100.100.22/24]
      eth1: [10.0.2.10/24]

reachability:
  - from: h1
    to: 10.0.2.10
    expected: true
  - from: h2
    to: 10.0.1.10
    expected: true
  - from: h1
    to: 10.255.255.2
    expected: true
